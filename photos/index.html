<!DOCTYPE html>
<html lang="ja">
  <head>
    <!-- Meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <title>amame04</title>
    <style> 
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        text-shadow: 1px 1px 2px #c0c0c0;
      }

      section {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-wrap: nowrap;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      img {
        margin: 2%;
        min-width: 0;
        min-height: 0;
        max-width: 96%;
        max-height: 90%;
        object-fit: contain;
        border: thick solid #ebebeb;
        box-shadow: 2px 5px 2px 2px #bbbbbb;
        cursor: pointer;
      }

      .summary {
        text-align: center;
        margin: 2%;
      }

      .link a, .link a:visited {
        color: #7b7b7b;
        text-decoration: none;
        border: none;
      }
    </style>
  </head>
  <body>

    <script src="photos.js"></script>
    <script>
      const createTitle = (tag) => {
        let titleHTML = `<section class="toc" id="${tag}">`;
        for (let camera in photos) {
          let cameraTag = camera.replace(' ', '');
          if (cameraTag === tag) {
            titleHTML += `<div><h1>${camera}</h1></div>`;
          } else {
            titleHTML += `<div class="link"><a href="#${cameraTag}">${camera}</a></div>`;
          }
        }
        titleHTML += '</section>';
        return titleHTML;
      }
      
      let photosHTML = '';
      for (let camera in photos) {
        let cameraTag = camera.replace(' ', '');
        photosHTML += createTitle(cameraTag);
        photos[camera].forEach((photo) => {
          photosHTML += `<section><img loading="lazy" src="thumbs/${cameraTag}/${photo.filename}.webp" onclick="location.href='images/${cameraTag}/${photo.filename}'"><div class="summary">${photo.summary}</div></section>`;
        })
      }

      document.body.insertAdjacentHTML('beforeend', photosHTML);
    </script>
  </body>
</html>
